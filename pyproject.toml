[project]
name = "sigline"
version = "1.3.2.dev0"
description = "A small public feed signed on Base."
authors = [
    { name = "buckket", email = "buckket@cock.li" }
]
readme = "README.rst"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.1,<4",
    "click>=8.0.0,<9",
    "humanize>=3.1.0,<5",
    "python-dateutil>=2.6.1,<3",
    "web3>=7.16.0,<8",
]

keywords = ["microblogging", "base", "onchain", "signed-feed", "sigline"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/0xnuminous/sigline"

[project.scripts]
sigline = "twtxt.cli:main"
twtxt = "twtxt.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twtxt*"]
